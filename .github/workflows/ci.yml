name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      # bin/ci is the whole gate. Nothing is duplicated here on purpose: a check that
      # exists only in the workflow is a check nobody can run before pushing.
      - run: bin/ci

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI rather than gitleaks-action: same binary and same rules as the
      # pre-commit hook, and it needs no write token. fetch-depth 0 is load-bearing,
      # since a shallow clone would scan a history that is mostly absent and report a
      # pass it cannot justify.
      - name: Secret scan (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact
