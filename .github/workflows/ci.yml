name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `edited` is load-bearing. The default types cover pushes, not text edits, so
    # without it the PR-text job only reruns on the next push and reads that event's
    # payload: a title fixed since then still fails, and a body edited afterwards to
    # add a tell passes.
    types: [opened, synchronize, reopened, edited]

jobs:
  ci:
    # The expensive job opts out of pure text edits, so correcting a typo in a PR
    # description does not trigger a full build.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      # bin/ci is the whole gate. Nothing is duplicated here on purpose: a check that
      # exists only in the workflow is a check nobody can run before pushing.
      - run: bin/ci

  # The tree is covered by bin/ci and the commit message by the commit-msg hook, but a
  # PR's title and body never touch the git tree, so nothing else can see them.
  slop-guard-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PR text has no slop
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$TITLE" "$BODY" | bin/slop-guard --stdin "PR text"

  gitleaks:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI rather than gitleaks-action: same binary and same rules as the
      # pre-commit hook, and it needs no write token. fetch-depth 0 is load-bearing,
      # since a shallow clone would scan a history that is mostly absent and report a
      # pass it cannot justify.
      - name: Secret scan (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact
